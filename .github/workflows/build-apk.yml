name: Gerar APK Android

on:
  push:
    branches: [ "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Preparar estrutura de arquivos
        run: |
          mkdir -p www
          cp index.html www/index.html
          echo '{"name":"meu-app","version":"1.0.0","dependencies":{"@capacitor/core":"^5.0.0","@capacitor/android":"^5.0.0"},"devDependencies":{"@capacitor/cli":"^5.0.0"}}' > package.json

      - name: Instalar dependências
        run: npm install

      - name: Inicializar Capacitor e Android
        run: |
          npx cap init "Meu Aplicativo" "com.meuaplicativo.app" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar o APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
